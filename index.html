<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cleopatra - Queen of the Nile</title>
  <style>
    :root {
      --gold: #ffd700;
      --gold-dark: #b8860b;
      --egypt-blue: #0f2b48;
      --egypt-red: #8b0000;
      --bg: #070a12;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 20%, #1e3c72 0%, #070a12 80%),
        linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.8));
      color: #fff;
      font-family: 'Cinzel', 'Trajan Pro', 'Segoe UI', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: rgba(15, 43, 72, 0.85);
      border: 4px solid var(--gold);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(0,0,0,0.8);
      padding: 20px;
      text-align: center;
      position: relative;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.7), 2px 2px 4px #000;
      letter-spacing: 3px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    header p {
      color: #7ef2ff;
      font-size: 0.95rem;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    /* Stats Bar */
    .dashboard {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid var(--gold-dark);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #aaa;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.4rem;
      color: var(--gold);
      font-weight: bold;
    }

    /* Reels Canvas Container */
    .machine-wrapper {
      position: relative;
      background: #000;
      border: 4px solid var(--gold-dark);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
      margin-bottom: 20px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .bet-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.4);
      padding: 8px 15px;
      border-radius: 6px;
      border: 1px solid var(--gold-dark);
    }

    button {
      background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: #000;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.2);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(1);
    }

    .btn-spin {
      padding: 14px 40px;
      font-size: 1.3rem;
      background: linear-gradient(180deg, #ff4500 0%, #8b0000 100%);
      color: #fff;
      border: 2px solid var(--gold);
      text-shadow: 1px 1px 2px #000;
    }

    .message-banner {
      min-height: 24px;
      margin-top: 15px;
      font-size: 1.1rem;
      color: #00ffcc;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
    }

    /* Paytable Modal */
    .paytable {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #ccc;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .pay-item {
      background: rgba(0,0,0,0.3);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,215,0,0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Cleopatra</h1>
      <p>Secrets of the Pharaohs</p>
    </header>

    <div class="dashboard">
      <div class="stat-box">
        <span class="stat-label">Balance</span>
        <span class="stat-value" id="balance">$1,000</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Total Bet</span>
        <span class="stat-value" id="bet-amount">$10</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Win</span>
        <span class="stat-value" id="win-amount">$0</span>
      </div>
    </div>

    <div class="machine-wrapper">
      <canvas id="slotCanvas" width="800" height="400"></canvas>
    </div>

    <div class="controls">
      <div class="bet-controls">
        <button id="btn-bet-down">-</button>
        <span style="font-size: 0.9rem; color: #aaa;">BET: <strong style="color:#fff;" id="bet-display">$10</strong></span>
        <button id="btn-bet-up">+</button>
      </div>

      <button id="btn-spin" class="btn-spin">SPIN</button>
      <button id="btn-max-bet">MAX BET</button>
    </div>

    <div class="message-banner" id="message">May Cleopatra bless your journey!</div>

    <div class="paytable">
      <div class="pay-item">👸 Cleopatra (Wild): 2x Multiplier</div>
      <div class="pay-item">👁️ Eye of Horus: 100x</div>
      <div class="pay-item">🪲 Scarab: 50x</div>
      <div class="pay-item">🏺 Ankh: 25x</div>
      <div class="pay-item">🏛️ Pyramid: 10x</div>
    </div>
  </div>

  <script>
    // System setup & Audio synthesizer (No external audio files required)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playTone(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Game Engine State
    const REELS = 5;
    const ROWS = 3;
    const SYMBOLS = [
      { id: 'cleo', name: 'Cleopatra', icon: '👸', color: '#ffd700', payout: 500, wild: true },
      { id: 'eye', name: 'Eye of Horus', icon: '👁️', color: '#00ffff', payout: 100 },
      { id: 'scarab', name: 'Scarab', icon: '🪲', color: '#00ff66', payout: 50 },
      { id: 'ankh', name: 'Ankh', icon: '🏺', color: '#ff00ff', payout: 25 },
      { id: 'pyramid', name: 'Pyramid', icon: '🏛️', color: '#ffaa00', payout: 10 },
      { id: 'A', name: 'Ace', icon: 'A', color: '#ffffff', payout: 5 },
      { id: 'K', name: 'King', icon: 'K', color: '#dddddd', payout: 4 },
      { id: 'Q', name: 'Queen', icon: 'Q', color: '#bbbbbb', payout: 3 }
    ];

    let balance = 1000;
    let currentBet = 10;
    let isSpinning = false;

    // Canvas setup
    const canvas = document.getElementById('slotCanvas');
    const ctx = canvas.getContext('2d');
    const symbolWidth = canvas.width / REELS;
    const symbolHeight = canvas.height / ROWS;

    // Grid matrix state
    let reelPositions = Array(REELS).fill(0);
    let reelSpeeds = Array(REELS).fill(0);
    let grid = Array(REELS).fill(null).map(() => Array(ROWS).fill(SYMBOLS[0]));

    // Initialize Grid with random symbols
    function initGrid() {
      for (let r = 0; r < REELS; r++) {
        for (let row = 0; row < ROWS; row++) {
          grid[r][row] = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        }
      }
      draw();
    }

    // Render Function
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background Grid
      for (let i = 0; i <= REELS; i++) {
        ctx.strokeStyle = '#b8860b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(i * symbolWidth, 0);
        ctx.lineTo(i * symbolWidth, canvas.height);
        ctx.stroke();
      }

      for (let r = 0; r < REELS; r++) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(r * symbolWidth, 0, symbolWidth, canvas.height);
        ctx.clip();

        const offset = reelPositions[r] % symbolHeight;

        for (let row = -1; row <= ROWS; row++) {
          let symIndex = (Math.floor(reelPositions[r] / symbolHeight) + row) % SYMBOLS.length;
          if (symIndex < 0) symIndex += SYMBOLS.length;
          
          let sym = isSpinning ? SYMBOLS[symIndex] : grid[r][Math.min(ROWS-1, Math.max(0, row))];
          if(!sym) sym = SYMBOLS[0];

          const x = r * symbolWidth + symbolWidth / 2;
          const y = row * symbolHeight + offset + symbolHeight / 2;

          // Draw Symbol Background glow for Cleopatra
          if (sym.id === 'cleo') {
            ctx.fillStyle = 'rgba(255, 215, 0, 0.15)';
            ctx.fillRect(r * symbolWidth + 5, y - symbolHeight/2 + 5, symbolWidth - 10, symbolHeight - 10);
          }

          // Render Icon / Text
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = sym.icon.length === 1 ? 'bold 48px serif' : '44px sans-serif';
          ctx.fillStyle = sym.color;
          ctx.fillText(sym.icon, x, y);
        }
        ctx.restore();
      }

      // Payline overlay center line
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
    }

    // Animation Loop
    function animate() {
      let stillSpinning = false;

      for (let i = 0; i < REELS; i++) {
        if (reelSpeeds[i] > 0) {
          stillSpinning = true;
          reelPositions[i] += reelSpeeds[i];
          reelSpeeds[i] *= 0.97; // deceleration

          if (reelSpeeds[i] < 2) {
            reelSpeeds[i] = 0;
            reelPositions[i] = Math.round(reelPositions[i] / symbolHeight) * symbolHeight;
            playTone(200 + i * 50, 'triangle', 0.08); // Reel stop sound
          }
        }
      }

      draw();

      if (stillSpinning) {
        requestAnimationFrame(animate);
      } else if (isSpinning) {
        isSpinning = false;
        evaluateWin();
        updateUI();
      }
    }

    // Spin trigger
    function spin() {
      if (isSpinning || balance < currentBet) return;

      balance -= currentBet;
      document.getElementById('win-amount').textContent = '$0';
      document.getElementById('message').textContent = 'The reels are spinning...';
      isSpinning = true;
      updateUI();

      // Randomize target grid
      for (let r = 0; r < REELS; r++) {
        for (let row = 0; row < ROWS; row++) {
          grid[r][row] = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        }
        reelSpeeds[r] = 25 + Math.random() * 10 + (r * 5); // Stagger reel stops
      }

      playTone(440, 'sine', 0.2);
      animate();
    }

    // Evaluate Wins across paylines (Horizontal Center line + Matches)
    function evaluateWin() {
      let totalWin = 0;
      const centerLine = [grid[0][1], grid[1][1], grid[2][1], grid[3][1], grid[4][1]];

      let matchCount = 1;
      let firstSym = centerLine[0];
      let hasWildMultiplier = firstSym.id === 'cleo';

      for (let i = 1; i < centerLine.length; i++) {
        let sym = centerLine[i];
        if (sym.id === 'cleo') hasWildMultiplier = true;

        if (sym.id === firstSym.id || sym.id === 'cleo' || firstSym.id === 'cleo') {
          matchCount++;
          if (firstSym.id === 'cleo' && sym.id !== 'cleo') {
            firstSym = sym;
          }
        } else {
          break;
        }
      }

      if (matchCount >= 3) {
        let basePayout = firstSym.payout * (matchCount - 2);
        if (hasWildMultiplier) basePayout *= 2; // Cleopatra Wild 2x Bonus
        totalWin = basePayout * (currentBet / 10);

        balance += totalWin;
        document.getElementById('win-amount').textContent = `$${totalWin.toFixed(0)}`;
        document.getElementById('message').textContent = 
          `✨ WINNER! ${matchCount}x ${firstSym.name} ${hasWildMultiplier ? '(2x Cleo Multiplier!)' : ''} - Paid $${totalWin}!`;

        // Victory fan-fare audio
        playTone(523.25, 'square', 0.15);
        setTimeout(() => playTone(659.25, 'square', 0.15), 150);
        setTimeout(() => playTone(783.99, 'square', 0.3), 300);
      } else {
        document.getElementById('message').textContent = 'Try again! May the Nile bring you luck.';
      }
    }

    // UI Updates
    function updateUI() {
      document.getElementById('balance').textContent = `$${balance.toLocaleString()}`;
      document.getElementById('bet-amount').textContent = `$${currentBet}`;
      document.getElementById('bet-display').textContent = `$${currentBet}`;
      document.getElementById('btn-spin').disabled = isSpinning || balance < currentBet;
    }

    // Event Listeners
    document.getElementById('btn-spin').addEventListener('click', spin);

    document.getElementById('btn-bet-up').addEventListener('click', () => {
      if (currentBet < 100 && !isSpinning) {
        currentBet += 10;
        updateUI();
      }
    });

    document.getElementById('btn-bet-down').addEventListener('click', () => {
      if (currentBet > 10 && !isSpinning) {
        currentBet -= 10;
        updateUI();
      }
    });

    document.getElementById('btn-max-bet').addEventListener('click', () => {
      if (!isSpinning) {
        currentBet = Math.min(100, balance);
        updateUI();
      }
    });

    // Initialize Engine
    initGrid();
    updateUI();
  </script>
</body>
</html>
